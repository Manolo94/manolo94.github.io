<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Simulation</title>
    <link rel="stylesheet" href="pool.css">
</head>
<body>
    <div class="canvas-container">
        <canvas id="poolCanvas"></canvas>
    </div>

    <div class="sidebar">
        <div class="sidebar-title">Pool Simulation</div>

        <div class="section">
            <div class="section-label">Parameters</div>
            <div class="field">
                <label>Board precision</label>
                <input id="sideCellsTxt" type="text" value="40">
            </div>
            <div class="field">
                <label>Pellets</label>
                <input id="numPelletsTxt" type="text" value="500">
            </div>
            <div class="field">
                <label>Thermal conductivity</label>
                <input id="thermalCondTxt" type="text" value="0.2">
            </div>
            <div class="field">
                <label>Pellet mass</label>
                <input id="pelletMassTxt" type="text" value="5">
            </div>
            <div class="field">
                <label>Heat sources</label>
                <input id="numHeatSourcesTxt" type="text" value="0">
            </div>
            <div class="field">
                <label>Initial energy</label>
                <input id="initialEnergyTxt" type="text" value="500">
            </div>
            <div class="field">
                <label>Max heat contribution</label>
                <input id="maxHeatContribTxt" type="text" value="0.3">
            </div>
            <button class="btn btn-run" id="runBtn">Run</button>
        </div>

        <div class="section">
            <div class="section-label">View</div>
            <div class="zoom-row">
                <button class="btn" id="zoomOutBtn">−</button>
                <span class="zoom-value" id="zoomDisplay">1.0×</span>
                <button class="btn" id="zoomInBtn">+</button>
            </div>
            <button class="btn btn-reset" id="resetViewBtn">Reset View</button>
            <p class="hint">Scroll to zoom · Drag to pan</p>
        </div>
    </div>

    <script type="module">
        import { Game } from './game.js';

        const game = new Game('poolCanvas');
        game.run();

        document.getElementById('runBtn').addEventListener('click', () => game.initialize());
        document.getElementById('zoomInBtn').addEventListener('click', () => game.setZoom(game.zoom * 1.25));
        document.getElementById('zoomOutBtn').addEventListener('click', () => game.setZoom(game.zoom / 1.25));
        document.getElementById('resetViewBtn').addEventListener('click', () => game.resetView());
    </script>
</body>
</html>
