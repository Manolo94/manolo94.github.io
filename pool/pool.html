<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Simulation</title>
    <link rel="stylesheet" href="pool.css">
</head>
<body>
    <div class="canvas-container">
        <canvas id="poolCanvas"></canvas>
    </div>

    <div class="sidebar">
        <div class="sidebar-title">Pool Simulation</div>
        <div class="tabs">
            <button class="tab active" id="tabSim">Simulation</button>
            <button class="tab" id="tabGA">Evolution</button>
        </div>

        <div id="paneSim">
        <div class="section">
            <div class="section-label">Parameters</div>
            <div class="field">
                <label>Board precision</label>
                <input id="sideCellsTxt" type="text" value="40">
            </div>
            <div class="field">
                <label>Organisms</label>
                <input id="numOrganismsTxt" type="text" value="20">
            </div>
            <div class="field">
                <label>Pellets per organism</label>
                <input id="pelletsPerOrgTxt" type="text" value="4">
            </div>
            <div class="field">
                <label>Organism size (cells)</label>
                <input id="organismSizeTxt" type="text" value="2">
            </div>
            <div class="field">
                <label>Thermal conductivity</label>
                <input id="thermalCondTxt" type="text" value="0.2">
            </div>
            <div class="field">
                <label>Pellet mass</label>
                <input id="pelletMassTxt" type="text" value="5">
            </div>
            <div class="field">
                <label>Heat sources</label>
                <input id="numHeatSourcesTxt" type="text" value="0">
            </div>
            <div class="field">
                <label>Initial energy</label>
                <input id="initialEnergyTxt" type="text" value="500">
            </div>
            <div class="field">
                <label>Max heat contribution</label>
                <input id="maxHeatContribTxt" type="text" value="0.3">
            </div>
            <button class="btn btn-run" id="runBtn">Run</button>
            <button class="btn btn-pause" id="pauseBtn" disabled>Pause</button>
        </div>
        </div><!-- end #paneSim -->

        <div id="paneGA" class="pane-hidden">
        <div class="section">
            <div class="section-label">Genetic Algorithm</div>
            <div class="field">
                <label>Elite survivors</label>
                <input id="eliteCountTxt" type="text" value="5">
            </div>
            <div class="field">
                <label>Mutation rate</label>
                <input id="mutationRateTxt" type="text" value="0.1">
            </div>
            <button class="btn btn-nextgen" id="nextGenBtn" disabled>Next Generation</button>
            <label class="autoplay-row">
                <input type="checkbox" id="autoplayChk">
                Autoplay
            </label>
        </div>
        <div class="section">
            <div class="section-label">Progress</div>
            <div class="gen-display" id="genDisplay">—</div>
        </div>
        </div><!-- end #paneGA -->

        <div class="section">
            <div class="section-label">View</div>
            <div class="zoom-row">
                <button class="btn" id="zoomOutBtn">−</button>
                <span class="zoom-value" id="zoomDisplay">1.0×</span>
                <button class="btn" id="zoomInBtn">+</button>
            </div>
            <button class="btn btn-reset" id="resetViewBtn">Reset View</button>
            <p class="hint">Scroll to zoom · Drag to pan</p>
        </div>
    </div>

    <script type="module">
        import { Game } from './game.js';

        const game = new Game('poolCanvas');
        game.run();

        document.getElementById('tabSim').addEventListener('click', () => {
            document.getElementById('paneSim').classList.remove('pane-hidden');
            document.getElementById('paneGA').classList.add('pane-hidden');
            document.getElementById('tabSim').classList.add('active');
            document.getElementById('tabGA').classList.remove('active');
        });
        document.getElementById('tabGA').addEventListener('click', () => {
            document.getElementById('paneGA').classList.remove('pane-hidden');
            document.getElementById('paneSim').classList.add('pane-hidden');
            document.getElementById('tabGA').classList.add('active');
            document.getElementById('tabSim').classList.remove('active');
        });

        document.getElementById('runBtn').addEventListener('click', () => {
            game.initialize();
            document.getElementById('runBtn').textContent = 'Restart';
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.disabled = false;
            pauseBtn.textContent = 'Pause';
        });
        document.getElementById('pauseBtn').addEventListener('click', () => {
            game.togglePause();
            document.getElementById('pauseBtn').textContent = game.paused ? 'Resume' : 'Pause';
        });
        document.getElementById('nextGenBtn').addEventListener('click', () => {
            game.nextGeneration();
        });
        document.getElementById('autoplayChk').addEventListener('change', e => {
            game.gaConfig.autoplay = e.target.checked;
        });
        document.getElementById('zoomInBtn').addEventListener('click', () => game.setZoom(game.zoom * 1.25));
        document.getElementById('zoomOutBtn').addEventListener('click', () => game.setZoom(game.zoom / 1.25));
        document.getElementById('resetViewBtn').addEventListener('click', () => game.resetView());
    </script>
</body>
</html>
